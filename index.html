<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette 7-Neighbor Tracker</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; border-radius: 4px; border: none; margin: 5px 0; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 20px; overflow-x: auto; display: block; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; min-width: 45px; }
        th { background: #333; }
        .win { color: #28a745; font-weight: bold; }
        .loss { color: #dc3545; }
        .best-bet { background: #333; padding: 15px; border-left: 5px solid #28a745; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Roulette 7-Neighbor Tracker</h2>
    
    <div>
        <label>Enter Result:</label><br>
        <input type="number" id="nextNumber" placeholder="e.g. 32" min="0" max="36">
        <button onclick="addResult()">Submit Spin</button>
    </div>

    <div id="bestBetDisplay" class="best-bet">
        Enter numbers to start tracking...
    </div>

    <table class="stats-table" id="statsTable">
        <thead>
            <tr id="rowNumbers"><th>No</th></tr>
            <tr id="rowPercent"><th>%</th></tr>
        </thead>
    </table>
</div>

<script>
    const WHEEL = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const NEIGHBOR_RANGE = 7;
    let allResults = [];

    function isWithinNeighbors(base, result) {
        const baseIdx = WHEEL.indexOf(base);
        const resIdx = WHEEL.indexOf(result);
        for (let i = -NEIGHBOR_RANGE; i <= NEIGHBOR_RANGE; i++) {
            let targetIdx = (baseIdx + i + WHEEL.length) % WHEEL.length;
            if (WHEEL[targetIdx] === result) return true;
        }
        return false;
    }

    function calculateStats() {
        let stats = WHEEL.map(num => {
            let wins = 0;
            allResults.forEach(res => {
                if (isWithinNeighbors(num, res)) wins++;
            });
            let pct = allResults.length > 0 ? (wins / allResults.length) * 100 : 0;
            return { num, pct: Math.round(pct) };
        });

        // Sort by percentage descending
        stats.sort((a, b) => b.pct - a.pct);
        updateUI(stats);
    }

    function updateUI(stats) {
        const rowNo = document.getElementById('rowNumbers');
        const rowPct = document.getElementById('rowPercent');
        const bestBetDiv = document.getElementById('bestBetDisplay');

        // Clear table
        rowNo.innerHTML = '<th>No</th>';
        rowPct.innerHTML = '<th>%</th>';

        stats.forEach(item => {
            rowNo.innerHTML += `<td>${item.num}</td>`;
            rowPct.innerHTML += `<td>${item.pct}%</td>`;
        });

        // Update Best Bet
        if (allResults.length > 0) {
            const best = stats[0];
            const lastResult = allResults[allResults.length - 1];
            const isWin = isWithinNeighbors(best.num, lastResult);
            
            bestBetDiv.innerHTML = `
                <strong>Best Target:</strong> ${best.num} (Sector Win Rate: ${best.pct}%)<br>
                <strong>Last Result:</strong> ${lastResult} 
                <span class="${isWin ? 'win' : 'loss'}">${isWin ? '✅ WIN' : '❌ LOSS'}</span>
            `;
        }
    }

    function addResult() {
        const input = document.getElementById('nextNumber');
        const val = parseInt(input.value);
        if (!isNaN(val) && val >= 0 && val <= 36) {
            allResults.push(val);
            input.value = '';
            calculateStats();
        }
    }
</script>

</body>
</html>
