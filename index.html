<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Roulette Neighbor Tracker</title>
    <style>
        :root { --green: #2ecc71; --red: #e74c3c; --black: #2c3e50; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: white; margin: 20px; }
        .grid-container { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* Betting Table Styling */
        .betting-table { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; background: #444; padding: 5px; border-radius: 5px; }
        .cell { width: 50px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; border-radius: 3px; transition: 0.2s; }
        .cell:hover { opacity: 0.8; transform: scale(1.05); }
        .zero { background: var(--green); grid-row: span 3; }
        .red { background: var(--red); }
        .black { background: var(--black); }

        /* Controls & Inputs */
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; flex: 1; min-width: 300px; }
        textarea { width: 100%; background: #000; color: var(--green); border: 1px solid #444; padding: 10px; border-radius: 5px; height: 80px; resize: none; }
        select { width: 100%; padding: 10px; margin: 10px 0; background: #333; color: white; border: none; }
        
        /* Stats Table */
        .stats-scroll { overflow-x: auto; margin-top: 20px; background: #1e1e1e; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #333; }
        .highlight { color: var(--gold); font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

<h2>Roulette Intelligence Dashboard</h2>

<div class="grid-container">
    <div class="panel">
        <h3>Input Results</h3>
        <div id="rouletteTable" class="betting-table">
            <div class="cell zero" onclick="addNumber(0)">0</div>
            </div>
        
        <h3 style="margin-top:20px;">Paste Results (Comma separated)</h3>
        <textarea id="bulkInput" placeholder="e.g., 32, 15, 19, 4, 21..."></textarea>
        <button onclick="processBulk()" style="width:100%; padding:10px; margin-top:5px; cursor:pointer;">Import History</button>
    </div>

    <div class="panel">
        <h3>Strategy Selection</h3>
        <select id="strategySelect">
            <option value="7">7-Neighbor Sector (European)</option>
            <option value="3">3-Neighbor Sector (Tight)</option>
            <option value="9">9-Neighbor Sector (Wide)</option>
        </select>

        <div id="recommendation" style="text-align: center; margin-top: 20px;">
            <p>Wait for data...</p>
        </div>
    </div>
</div>

<div class="stats-scroll">
    <table id="statsTable">
        <thead>
            <tr id="headNumbers"><th>Number</th></tr>
            <tr id="headWinRate"><th>Win Rate %</th></tr>
        </thead>
    </table>
</div>

<script>
    const WHEEL = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    let history = [];

    // Initialize Table UI
    const table = document.getElementById('rouletteTable');
    for (let i = 1; i <= 36; i++) {
        let colorClass = REDS.includes(i) ? 'red' : 'black';
        let cell = `<div class="cell ${colorClass}" onclick="addNumber(${i})">${i}</div>`;
        table.innerHTML += cell;
    }

    function addNumber(num) {
        history.push(num);
        updateAnalysis();
    }

    function processBulk() {
        const input = document.getElementById('bulkInput').value;
        const nums = input.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
        history = [...history, ...nums];
        updateAnalysis();
    }

    function updateAnalysis() {
        if (history.length === 0) return;

        const range = parseInt(document.getElementById('strategySelect').value);
        let results = WHEEL.map(base => {
            let wins = 0;
            history.forEach(spin => {
                if (checkNeighbor(base, spin, range)) wins++;
            });
            return { num: base, pct: (wins / history.length * 100).toFixed(1) };
        });

        results.sort((a, b) => b.pct - a.pct);
        renderStats(results);
        renderRecommendation(results[0]);
    }

    function checkNeighbor(base, result, range) {
        let bIdx = WHEEL.indexOf(base);
        for (let i = -range; i <= range; i++) {
            let idx = (bIdx + i + 37) % 37;
            if (WHEEL[idx] === result) return true;
        }
        return false;
    }

    function renderStats(data) {
        const hNum = document.getElementById('headNumbers');
        const hPct = document.getElementById('headWinRate');
        hNum.innerHTML = '<th>No.</th>';
        hPct.innerHTML = '<th>Win%</th>';

        data.slice(0, 15).forEach(d => {
            hNum.innerHTML += `<td>${d.num}</td>`;
            hPct.innerHTML += `<td>${d.pct}%</td>`;
        });
    }

    function renderRecommendation(best) {
        const div = document.getElementById('recommendation');
        div.innerHTML = `
            <h1 style="color:var(--gold); margin:0;">${best.num}</h1>
            <p>Target this sector</p>
            <div style="font-size: 0.9em; color: #888;">Sector Success Rate: ${best.pct}%</div>
        `;
    }
</script>
</body>
</html>
